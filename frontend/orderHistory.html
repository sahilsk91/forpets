<!DOCTYPE html>
<html>
<head>
  <title>My Orders | FORPETS</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---------- order tracking timeline ---------- */
    .tracking {
      display: flex;
      justify-content: space-between;
      margin: 18px 0 8px;
      position: relative;
    }

    .tracking::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 6%;
      right: 6%;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      z-index: 0;
    }

    .tracking .progress-line {
      position: absolute;
      top: 12px;
      left: 6%;
      height: 4px;
      background: #ff8c42;
      border-radius: 2px;
      z-index: 1;
      transition: width 0.4s ease;
    }

    .track-step {
      position: relative;
      z-index: 2;
      text-align: center;
      flex: 1;
    }

    .track-step .dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #eee;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #ddd;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
    }

    .track-step.done .dot {
      background: #ff8c42;
      box-shadow: 0 0 0 2px #ff8c42;
    }

    .track-step.cancelled .dot {
      background: #d33;
      box-shadow: 0 0 0 2px #d33;
    }

    .track-step small {
      font-size: 11px;
      color: #888;
    }

    .track-step.done small {
      color: #e0561d;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2 style="text-align:center;margin-top:20px;">📦 My Orders</h2>

<div id="orderList">
  <!-- orders -->
</div>

<script src="js/orderHistory.js"></script>
</body>
</html>
